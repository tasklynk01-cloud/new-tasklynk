name: Release Payouts

on:
  schedule:
    # Runs daily at 01:30 UTC — adjust as needed
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  APP_URL: ${{ secrets.APP_URL }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL }}
  RELEASE_PAYOUTS_URL: ${{ secrets.RELEASE_PAYOUTS_URL }}
  RELEASE_CRON_ADMIN_EMAIL: ${{ secrets.RELEASE_CRON_ADMIN_EMAIL }}
  ADMIN_EMAIL: ${{ secrets.RELEASE_CRON_ADMIN_EMAIL }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  TURSO_CONNECTION_URL: ${{ secrets.TURSO_CONNECTION_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  RELEASE_MIN_HOURS: ${{ vars.RELEASE_MIN_HOURS }}
  RELEASE_DRY_RUN: ${{ vars.RELEASE_DRY_RUN }}
  APP_HEALTH_PATH: ${{ vars.APP_HEALTH_PATH }}

jobs:
  run-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          required_vars=(APP_URL JWT_SECRET TURSO_CONNECTION_URL TURSO_AUTH_TOKEN RELEASE_CRON_ADMIN_EMAIL)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Environment variable $var is required but not set." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Health check application
        shell: bash
        run: |
          set -euo pipefail
          health_path="${APP_HEALTH_PATH:-/api/health}"
          base_url="${APP_URL%/}"
          echo "Checking ${base_url}${health_path}"
          curl --fail --silent --show-error "${base_url}${health_path}" >/tmp/app-health.json
          echo "Health check successful"

      - name: Release reserved payouts
        run: |
          set -euo pipefail
          min_hours="$RELEASE_MIN_HOURS"
          if ! [[ "$min_hours" =~ ^[0-9]+$ ]]; then
            min_hours=24
          fi
          echo "Running release script (dryRun=$RELEASE_DRY_RUN, minHours=$min_hours)"
          npx tsx scripts/run-release-payouts.ts --dryRun=$RELEASE_DRY_RUN --minHours=$min_hours
