<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  
  <!-- Subtle Glow -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.08" filter="blur(50px)"/>
  <circle cx="650" cy="350" r="180" fill="#ff8c42" opacity="0.08" filter="blur(50px)"/>
  
  <!-- Main Card -->
  <rect x="80" y="55" width="640" height="340" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="120" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">SPSS &amp; Statistical Data Analysis</text>
  <text x="120" y="135" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Quantitative Research &amp; Hypothesis Testing Guide</text>
  
  <rect x="120" y="155" width="560" height="1" fill="#334155"/>
  
  <!-- Chart Bars Mockup -->
  <rect x="140" y="270" width="40" height="70" rx="6" fill="url(#chartGrad)"/>
  <rect x="200" y="220" width="40" height="120" rx="6" fill="url(#orangeGrad)"/>
  <rect x="260" y="190" width="40" height="150" rx="6" fill="url(#chartGrad)"/>
  <rect x="320" y="240" width="40" height="100" rx="6" fill="url(#orangeGrad)"/>
  <rect x="380" y="180" width="40" height="160" rx="6" fill="url(#chartGrad)"/>
  <rect x="440" y="210" width="40" height="130" rx="6" fill="url(#orangeGrad)"/>
  
  <!-- Axis line -->
  <line x1="120" y1="340" x2="500" y2="340" stroke="#475569" stroke-width="2"/>
  
  <!-- Side Info Card -->
  <rect x="520" y="180" width="160" height="160" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="540" y="215" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">R² = 0.892</text>
  <text x="540" y="235" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">p &lt; .001 (Sig.)</text>
  
  <text x="540" y="275" fill="#ff8c42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">ANOVA F(2, 98)</text>
  <text x="540" y="295" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Post-Hoc Tukey HSD</text>
  
  <rect x="540" y="315" width="120" height="6" rx="3" fill="#10b981"/>
</svg>
